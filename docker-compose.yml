# Локальная инфраструктура разработки MY_LMS (задача T0.07, docs/10 §1).
# Инфраструктура: postgres / redis / minio / minio-init (запускается по умолчанию).
# Backend `app` — только в профиле `full` (`docker compose --profile full up`): при обычной
# разработке backend запускается на хосте (uvicorn), иначе он займёт порт 8000 и запустит
# второй polling того же бота.
# Профиль `full` (T1.17): app + nginx со сборкой фронтенда (http://127.0.0.1:8080).
# Профили `dev` и `full` (T5.04) добавляют worker и scheduler (TaskIQ): `docker compose --profile dev up -d`.
# scheduler ровно один и без реплик: два планировщика поставят каждую задачу дважды.
# Продакшен-окружение настраивается отдельно (docker-compose.prod.yml) — не здесь.
#
# Все пароли и ключи ниже — безопасные тестовые значения для локальной
# разработки. Реальные секреты живут только в .env.local (не коммитится).

name: my-lms-local

# Общие настройки фоновых процессов (worker и scheduler): тот же образ и окружение, что у `app`.
x-background: &background
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env.local
  environment:
    DATABASE_URL: postgresql+asyncpg://lms:lms_dev_password@postgres:5432/lms
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  # Healthcheck образа проверяет HTTP-порт API, а у фонового процесса его нет.
  healthcheck:
    disable: true
  # Время на корректное завершение текущей задачи после SIGTERM.
  stop_grace_period: 30s
  restart: unless-stopped

services:
  # --- PostgreSQL 16 (docs/02 §2.3) ---
  postgres:
    image: postgres:16
    container_name: my-lms-postgres
    environment:
      # Тестовые локальные значения, не production credentials.
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_dev_password
      POSTGRES_DB: lms
    ports:
      # Публикуем только на localhost, наружу сервер не виден.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Redis 7 (docs/02 §2.3). Volume не обязателен: локальные FSM/сессии. ---
  redis:
    image: redis:7
    container_name: my-lms-redis
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- MinIO: локальная эмуляция S3-совместимого хранилища (docs/10 §1) ---
  # Community-образы minio/minio больше не публикуются (source-only), поэтому
  # сервер собирается локально из официального исходника строгой версии
  # RELEASE.2025-10-15T17-29-55Z (minio/Dockerfile). Заменяет `image:`.
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: lms-minio:RELEASE.2025-10-15T17-29-55Z
    container_name: my-lms-minio
    command: ["server", "/data", "--console-address", "0.0.0.0:9001"]
    environment:
      # Тестовые локальные значения, не production credentials.
      MINIO_ROOT_USER: lmsadmin
      MINIO_ROOT_PASSWORD: lms_dev_password
    ports:
      # API и консоль управления — только на localhost.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    # Собственный образ не содержит `mc` (в официальном community-образе он
    # тоже отсутствовал), поэтому healthcheck — HTTP GET на стандартный
    # эндпоинт MinIO `/minio/health/live` через curl из базового слоя.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Одноразовый контейнер: создаёт приватный bucket lms-files ---
  # Community-образы minio/mc больше не публикуются (source-only), поэтому
  # клиент собирается локально из официального исходника строгой версии
  # RELEASE.2025-08-13T08-35-41Z (minio/mc/Dockerfile). Заменяет `image:`.
  minio-init:
    build:
      context: ./minio/mc
      dockerfile: Dockerfile
    image: lms-mc:RELEASE.2025-08-13T08-35-41Z
    container_name: my-lms-minio-init
    depends_on:
      minio:
        condition: service_healthy
    # Команда выполняется через `sh -c "<скрипт>"` (exec form). Скрипт:
    # ждёт готовности MinIO, создаёт bucket lms-files и убирает любой
    # anonymous/public доступ, после чего контейнер успешно завершается.
    command:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 lmsadmin lms_dev_password 2>/dev/null; do
          echo "Ожидание MinIO..."
          sleep 2
        done
        mc mb --ignore-existing local/lms-files
        # Bucket приватный: снимаем все anonymous-политики (docs/09).
        mc anonymous set none local/lms-files
        echo "Bucket lms-files создан, anonymous access отсутствует"
    restart: "no"

  # --- Backend-приложение (собирается из корневого Dockerfile), профиль `full` ---
  app:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-lms-app
    env_file:
      # Локальные настройки и тестовые секреты; файл не коммитится в Git.
      - .env.local
    environment:
      # Внутри контейнера 127.0.0.1 — это сам контейнер: адреса сервисов берутся из сети
      # compose и перекрывают значения из .env.local (они рассчитаны на backend на хосте).
      DATABASE_URL: postgresql+asyncpg://lms:lms_dev_password@postgres:5432/lms
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      # Подписанные ссылки строятся от публичного адреса: minio:9000 виден только внутри сети
      # compose. Пусто в .env.local - 127.0.0.1:9000 (открывается на ПК; для телефона задайте
      # в .env.local публичный адрес, например туннель на порт 9000).
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
    ports:
      # Порт API — только на localhost (nginx появится позже, docs/10 §3).
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Миграции запускаются вручную (`alembic upgrade head`), не автоматически.

  # --- Nginx со сборкой фронтенда (frontend/Dockerfile), профиль `full` ---
  # Раздаёт SPA и проксирует /api, /telegram, /health на app. Порт 8080 только на localhost:
  # сюда направляется HTTPS-туннель (`scripts/dev_tunnel.sh 8080`), порт 5173 остаётся за pnpm dev.
  nginx:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Публичное значение (username бота без @) вшивается в сборку фронтенда.
        VITE_BOT_USERNAME: ${VITE_BOT_USERNAME:-}
    container_name: my-lms-nginx
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy

  # --- Воркер фоновых задач TaskIQ (docs/03 §9) ---
  worker:
    <<: *background
    profiles: ["dev", "full"]
    container_name: my-lms-worker
    command: ["taskiq", "worker", "src.worker.broker:broker", "src.worker.tasks", "--workers", "1"]

  # --- Планировщик TaskIQ: СТРОГО один экземпляр (не масштабировать, не добавлять реплики) ---
  scheduler:
    <<: *background
    profiles: ["dev", "full"]
    container_name: my-lms-scheduler
    command: ["taskiq", "scheduler", "src.worker.broker:scheduler", "src.worker.tasks"]

volumes:
  postgres_data:
  minio_data:
