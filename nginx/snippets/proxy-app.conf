# Проксирование на backend (контейнер app). Подключается из location в default.conf.
# X-Forwarded-For задаётся равным реальному адресу клиента ($remote_addr после realip), а не
# дописывается к значению клиента: подделать IP для лимитов нельзя.
proxy_pass http://app:8000;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
