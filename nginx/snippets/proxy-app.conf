# Проксирование на backend (контейнер app). Подключается из location в default.conf.
# X-Forwarded-For задаётся равным адресу соединения ($remote_addr), а не дописывается к значению
# клиента: подделать IP для лимитов нельзя (см. комментарий о realip в conf.d/default.conf).
# Адрес backend задан переменной, поэтому nginx разрешает имя app при КАЖДОМ запросе (кеш DNS
# 5 секунд, см. resolver в conf.d/default.conf), а не один раз при старте: после пересборки
# (`docker compose up -d --build`) контейнер app получает новый IP, и старый адрес давал бы 502.
# Путь запроса при такой форме proxy_pass передаётся без изменений.
set $app_upstream app:8000;
proxy_pass http://$app_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
