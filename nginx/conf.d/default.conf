# Nginx для MY_LMS (T1.17, docs/10 §3): статика SPA + прокси на backend.
# TLS здесь не настраивается: локально его завершает туннель (cloudflared), на сервере —
# блок listen 443 ssl и HSTS появятся в T9.02. Фронтенд и API — на одном домене (CORS не нужен).

server_tokens off;

# IP клиента: заголовку X-Forwarded-For от входящего запроса НЕ доверяем (модуль realip не
# включён). Для backend nginx сам ставит X-Forwarded-For равным адресу соединения ($remote_addr),
# поэтому подделать IP заголовком нельзя (docs/08 §10: лимит /auth/* по IP).
#   - на сервере (T9.02) nginx смотрит в интернет напрямую, $remote_addr — реальный клиент;
#   - локально Docker Desktop показывает nginx адрес шлюза (например, 172.19.0.1) для всего,
#     что приходит с хоста, включая туннель: лимит /auth/* там общий, это допустимо для разработки.
# Если перед nginx появится доверенный прокси или балансировщик, добавьте set_real_ip_from
# с ТОЧНЫМ адресом этого прокси (не целым диапазоном частных сетей).

# DNS Docker (встроенный резолвер сети compose). Нужен, чтобы nginx находил контейнер app по имени
# заново после его пересоздания: адрес берётся из переменной в snippets/proxy-app.conf.
# Если nginx когда-нибудь работает вне Docker, замените адрес на свой резолвер.
resolver 127.0.0.11 valid=5s ipv6=off;

# Протокол для backend: туннель сообщает https в X-Forwarded-Proto, иначе берём свой.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Журнал доступа без секретов в пути: сегмент вебхука (выводится из WEBHOOK_SECRET) и одноразовый
# токен входа /login/<токен> (docs/09 §4 «логи без секретов»; аудит 2026-10-08, п. 7).
# Сопоставление идёт по $request_uri, а не по $uri: для маршрутов SPA try_files делает внутренний
# переход на /index.html, и к моменту записи журнала $uri уже не содержит исходный путь.
map $request_uri $log_uri {
    ~^/telegram/webhook/ "/telegram/webhook/***";
    ~^/login/            "/login/***";
    default              $request_uri;
}
log_format redacted '$remote_addr [$time_local] "$request_method $log_uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent" rt=$request_time';

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

server {
    listen 80;
    server_name _;

    # access_log на уровне server заменяет общий журнал nginx.conf (иначе строки задвоились бы).
    access_log /var/log/nginx/access.log redacted;

    root /usr/share/nginx/html;
    index index.html;

    # Загрузка файлов ДЗ до 10 МБ (docs/10 §3) плюс запас на multipart.
    client_max_body_size 12m;

    include snippets/security-headers.conf;

    # Тело больше client_max_body_size отсекает сам nginx: отвечаем в формате ошибок API
    # (docs/08 §1), а не HTML-страницей (аудит 2026-10-08, п. 16).
    error_page 413 = @payload_too_large;
    location @payload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error":{"code":"file_too_large","message":"Файл слишком большой: не больше 10 МБ.","details":{}}}';
    }

    # --- Backend ---------------------------------------------------------------------------
    # Один набор proxy-заголовков для всех location, ведущих на app (include ниже).
    location /api/ {
        include snippets/proxy-app.conf;
    }

    location /telegram/ {
        include snippets/proxy-app.conf;
    }

    location = /health {
        include snippets/proxy-app.conf;
    }

    # --- Статика SPA -----------------------------------------------------------------------
    # Файлы с хэшем в имени кэшируются навсегда.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include snippets/security-headers.conf;
    }

    # index.html не кэшируется: обновления доходят сразу.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }

    # Маршруты SPA (/login/<токен>, /app/..., /admin/...) отдают index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include snippets/security-headers.conf;
    }
}
