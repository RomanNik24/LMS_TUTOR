[project]
name = "my-lms-backend"
version = "0.1.0"
description = "Backend of MY_LMS: Telegram bot, REST API and background jobs"
requires-python = ">=3.11"
dependencies = [
    "alembic",
    "asyncpg",
    "fastapi",
    "pydantic-settings",
    "python-json-logger",
    "redis",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "testcontainers",
    "time-machine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff (линтер и форматер) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "DTZ"]

# S101: assert допустим в тестах.
# DTZ: правила проверки дат включаем осознанно, suppress не используем.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["src"]
warn_unreachable = true
disallow_any_generics = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["time_machine.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
