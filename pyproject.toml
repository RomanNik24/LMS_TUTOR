[project]
name = "my-lms-backend"
version = "0.1.0"
description = "Backend of MY_LMS: Telegram bot, REST API and background jobs"
requires-python = ">=3.11"
dependencies = [
    "aioboto3>=15.5.0",
    "aiogram>=3.31.0",
    "aiohttp-socks>=0.12.0",
    "alembic",
    "asyncpg",
    "fastapi",
    "pillow>=12.3.0",
    "pillow-heif>=1.8.0",
    "pydantic-settings",
    "python-json-logger",
    "python-multipart>=0.0.32",
    "redis",
    "sentry-sdk>=2.71.0",
    "sqlalchemy[asyncio]",
    "taskiq>=0.13.0",
    "taskiq-redis>=1.2.4",
    "tzdata",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "moto[server]>=5.2.3",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "testcontainers",
    "time-machine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Ruff (линтер и форматер) ---
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "DTZ"]

# S101: assert допустим в тестах.
# DTZ: правила проверки дат включаем осознанно, suppress не используем.
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
docstring-code-format = true

# --- MyPy ---
[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["src"]
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
show_error_codes = true

[[tool.mypy.overrides]]
module = ["time_machine.*", "aioboto3.*", "botocore.*"]
ignore_missing_imports = true

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # fastapi.testclient в тестах ошибок и логов: предупреждение библиотеки, не ошибка проекта.
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
markers = [
    "integration: тесты с реальными PostgreSQL/Redis (Testcontainers или service containers)",
    "security: тесты безопасности и прав доступа",
]
