# Конфигурация Alembic (задача T1.03).
#
# Расположение по ADR 0002 (docs/adr/0002-migration-location.md):
#   - alembic.ini — в корне репозитория;
#   - ревизии миграций — в src/db/migrations/.
#
# Строка подключения к БД задаётся НЕ здесь, а в src/db/migrations/env.py
# через Settings приложения (src/core/config.py, переменная окружения
# DATABASE_URL) — секреты не хранятся в Git (docs/06, правила секретов).
#
# Комментарии на русском согласно docs/06_agent_rules.md.

[alembic]
# Каталог скриптов миграций: env.py и versions/ (ADR 0002).
script_location = src/db/migrations

# Корень проекта в sys.path при запуске alembic — чтобы env.py мог импортировать
# пакет src (модели T1.02 и Settings).
prepend_sys_path = .

# Имя файла ревизии: метка времени + идентификатор + slug (детерминированный вид).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Префикс путей внутри script_location не используем.
truncate_slug_length = 40

# Версия часового пояса в метках имён файлов ревизий (проект живёт в UTC).
timezone = UTC

# Пути шаблонов автогенерации (стандартные из пакета alembic).
template_args.keys = member_name,attr,cls

# black/ruff-форматирование сгенерированных ревизий не включаем: ревизии
# пишутся руками и проходят общие проверки ruff из pyproject.toml.

# Раздел sqlalchemy.url заполняется в env.py из Settings (DATABASE_URL).
# Значение ниже — только заглушка для инструментов, читающих ini напрямую.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

# --- Логирование ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
