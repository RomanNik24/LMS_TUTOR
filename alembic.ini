# Alembic configuration (T1.03).
#
# Location per ADR 0002 (docs/adr/0002-migration-location.md):
#   - alembic.ini in repository root;
#   - migration revisions in src/db/migrations/.
#
# Database connection is set NOT here but in src/db/migrations/env.py
# through app Settings (src/core/config.py, env var DATABASE_URL) - secrets
# are not stored in Git (docs/06, secret rules).
#
# File is ASCII-only: UTF-8 comments broke Alembic on Windows (cp1251 locale).

[alembic]
# Migration scripts directory: env.py and versions/ (ADR 0002).
script_location = src/db/migrations

# Project root in sys.path when running alembic - so env.py can import
# the src package (T1.02 models and Settings).
prepend_sys_path = .

# How to split prepend_sys_path (os = os.pathsep): avoids Alembic's legacy
# space/comma/colon splitting and the associated DeprecationWarning.
path_separator = os

# Revision file name: timestamp + id + slug (deterministic).
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No path prefix inside script_location.
truncate_slug_length = 40

# Timezone used in revision file name stamps (project lives in UTC).
timezone = UTC

# Autogeneration template paths (standard ones from the alembic package).
template_args.keys = member_name,attr,cls

# black/ruff formatting of generated revisions is not enabled: revisions
# are written by hand and pass common ruff checks from pyproject.toml.

# The sqlalchemy.url section is filled in env.py from Settings (DATABASE_URL).
# The value below is only a placeholder for tools that read ini directly.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]

# --- Logging ---
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
